name: Caper
description: >-
  Caper (caper.ai) is a New York-founded computer-vision company that builds AI-powered smart
  shopping carts and cashierless checkout technology for grocery and retail. Its Caper Cart uses
  a set of onboard cameras and deep-learning object recognition, running on NVIDIA Jetson edge AI,
  to auto-detect items as shoppers add them and let customers skip the checkout line. Founded in
  2016 (Y Combinator) by Lindon Gao and team, Caper was acquired by Instacart in 2021 for roughly
  $350M and now operates as part of the Instacart Enterprise Platform (Connected Stores), deployed
  with retailers including ALDI and Coles. Caper ships retail hardware and an internal edge/vision
  platform; it does not publish a public developer API, OpenAPI, SDKs, or a developer portal.
